name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check pakhi/ tests/ examples/
      - name: Ruff format check
        run: ruff format --check pakhi/ tests/ examples/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev libgfortran5
      - name: Install pakhi
        # The WS-3 API test suite needs the `api` extra (fastapi/httpx/websockets),
        # which is intentionally not in `[all]`; install it for the test job.
        run: pip install -e ".[all,api]"
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=pakhi --cov-report=xml
      - name: Secrets scan
        # WS-4 T3: the tracked tree must carry no secret-shaped value and no
        # committed .env. Fails the build if the scanner finds anything.
        run: python scripts/secret_scan.py
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pakhi:test .
      - name: Verify CLI works in container
        run: docker run --rm pakhi:test --version
      - name: Verify health check
        run: docker run --rm pakhi:test status
