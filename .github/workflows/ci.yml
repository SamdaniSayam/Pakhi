name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check pakhi/ tests/ examples/
      - name: Ruff format check
        run: ruff format --check pakhi/ tests/ examples/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pakhi
          POSTGRES_PASSWORD: pakhi
          POSTGRES_DB: pakhi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pakhi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Brings the WS-4/WS-5 integration tests into the main matrix (they were
      # previously only exercised by the private repo's ws4-security.yml). psycopg
      # v3 (not the `postgres` extra's psycopg2-binary, which segfaults at exit).
      WS4_TEST_DB_URL: postgresql+psycopg://pakhi:pakhi@localhost:5432/pakhi_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev libgfortran5
      - name: Install pakhi
        # The WS-3 API test suite needs the `api` extra (fastapi/httpx/websockets)
        # and the `obs` extra (prometheus_client, used by pakhi.ws5.metrics).
        # The `redis` extra + psycopg v3 back the WS-4/WS-5 integration tests
        # (test_ws4_t5_ci, test_ws5_t1_redis) so they run here, not only in the
        # private repo's ws4-security.yml.
        run: pip install -e ".[all,api,redis,obs]" "psycopg[binary]>=3.1"
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=pakhi --cov-report=xml
      - name: Secrets scan
        # WS-4 T3: the tracked tree must carry no secret-shaped value and no
        # committed .env. Fails the build if the scanner finds anything.
        run: python scripts/secret_scan.py
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  supply-chain:
    name: Supply chain (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pakhi + pip-audit
        run: |
          pip install -e ".[all,api,obs]"
          pip install pip-audit
      - name: pip-audit (fail on known vulnerable deps)
        run: pip-audit --require-hashes || pip-audit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t pakhi:test .
      - name: Verify CLI works in container
        run: docker run --rm pakhi:test --version
      - name: Verify health check
        run: docker run --rm pakhi:test status
