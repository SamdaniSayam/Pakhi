name: ws2-daily

# WS-2 T3 scheduler option B (GitHub Actions runner): fires once a day after
# the locked 12Z GFS cycle publishes (~15:35Z). The runner must have network
# access to NOAA/NOMADS and to the configured alert webhook. This is a
# drop-in alternative to deploy/ws2-orchestrate.{service,timer}.
on:
  schedule:
    - cron: "5 16 * * *" # 16:05 UTC daily
  workflow_dispatch: {}

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAKHI_ALERT_WEBHOOK_URL: ${{ secrets.PAKHI_ALERT_WEBHOOK_URL }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pakhi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[all,postgres]"
      - name: Run daily ingest -> compute -> store
        run: python scripts/run_ws2_t3_orchestrate.py --db postgresql://postgres:postgres@localhost:5432/pakhi
        # Exit != 0 surfaces on the Actions board and can be webhook-alerted;
        # the pipeline never drops a cycle silently.
