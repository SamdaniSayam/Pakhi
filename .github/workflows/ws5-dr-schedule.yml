name: ws5-dr-schedule

# WS-5 DR Drill — scheduled weekly backup + restore verification.
# The push/PR workflow (ws5-dr.yml) catches regressions on every commit;
# this scheduled workflow proves the drill runs against a real Postgres
# instance on a calendar cadence (RPO/RTO assurance).
#
# A non-zero exit surfaces on the Actions board (no silent failure, per
# the WS-5 reliability contract twin §dr).
on:
  schedule:
    - cron: "0 3 * * 0"  # 03:00 UTC every Sunday — low-traffic window
  workflow_dispatch: {}

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAKHI_DB_WRITE_URL: postgresql+psycopg://pakhi:pakhi@localhost:5432/pakhi_test
      PAKHI_DB_READ_URL: postgresql+psycopg://pakhi:pakhi@localhost:5432/pakhi_restore
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pakhi
          POSTGRES_PASSWORD: pakhi
          POSTGRES_DB: pakhi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pakhi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pakhi + drivers
        run: pip install -e ".[all,postgres]" "psycopg[binary]>=3.1"
      - name: Seed the data store
        run: |
          set -euo pipefail
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine, text
          from pakhi.ws4.db import init_db
          from pakhi.ws6.db import init_db as ws6_init
          eng = create_engine(os.environ["PAKHI_DB_WRITE_URL"])
          init_db(eng)
          ws6_init(eng)
          with eng.begin() as c:
              c.execute(text("SELECT 1"))
          print("data store seeded")
          EOF
      - name: Run backup
        run: |
          set -euo pipefail
          python scripts/run_ws5_backup.py \
            --source-url "$PAKHI_DB_WRITE_URL" \
            --backup-dir /tmp/pakhi-backup
      - name: Run full restore drill
        run: |
          set -euo pipefail
          python scripts/run_ws5_restore_drill.py \
            --source-url "$PAKHI_DB_WRITE_URL" \
            --scratch-url "$PAKHI_DB_READ_URL" \
            --backup-dir /tmp/pakhi-backup
      - name: Verify chain integrity on restored store
        run: |
          set -euo pipefail
          python - <<'EOF'
          import os
          from sqlalchemy import create_engine
          from pakhi.ws4.audit_events import verify_chain_in_store
          eng = create_engine(os.environ["PAKHI_DB_READ_URL"])
          ok = verify_chain_in_store(eng)
          assert ok, "audit chain verification failed on restored store"
          print("restored store audit chain OK")
          EOF
