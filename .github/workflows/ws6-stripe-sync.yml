name: ws6-stripe-sync

# WS-6 T2 scheduler: daily Stripe usage sync — the locked cadence (contract
# §5, "daily every 24h, never an end-of-month dump"). Runs the sync against a
# scratch Postgres in TEST MODE (`--fake` transport): the contract prohibits
# live keys; CI proves the pipeline + staleness accounting with recorded
# submissions, and a non-zero exit surfaces on the Actions board (no silent
# failure, per the sync staleness rule).
on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC daily — past midnight UTC, one full day prior
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAKHI_DB_WRITE_URL: postgresql+psycopg://pakhi:pakhi@localhost:5432/pakhi_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pakhi
          POSTGRES_PASSWORD: pakhi
          POSTGRES_DB: pakhi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pakhi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pakhi + drivers
        run: pip install -e ".[all,api,redis,obs]" "psycopg[binary]>=3.1"
      - name: Seed a tenant + one day of metered usage
        run: |
          set -euo pipefail
          python - <<'EOF'
          import os
          from datetime import datetime, timedelta, timezone
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session

          from pakhi.ws4.audit_events import AuditSpec, apply_audit
          from pakhi.ws4.db import Tenant
          from pakhi.ws4.service import upsert_tenant
          from pakhi.ws6.db import init_db

          eng = create_engine(os.environ["PAKHI_DB_WRITE_URL"])
          init_db(eng)
          upsert_tenant(eng, tenant_id="ci-acme", name="ci-acme", tier="pro")
          # The daily sync attaches usage to the tenant's Stripe subscription
          # *item* id (si_...), captured from the webhook — seed one so CI
          # proves the real submission path, not an empty sync.
          with Session(eng) as s:
              row = s.get(Tenant, "ci-acme")
              row.stripe_customer_id = "cus_ci_acme"
              row.stripe_subscription_item_id = "si_ci_acme"
              s.commit()
          day = (datetime.now(timezone.utc) - timedelta(days=1)).replace(
              hour=0, minute=0, second=0, microsecond=0
          )
          for i in range(3):
              with Session(eng) as s:
                  apply_audit(s, AuditSpec(request_id=f"ci-{i}", tenant_id="ci-acme",
                                           actor_id="ci", action="read", resource="res",
                                           ts=(day + timedelta(minutes=i)).isoformat()))
                  s.commit()
          print("seeded 3 metered api calls for ci-acme on", day.date())
          EOF
      - name: Run the daily sync (test-mode fake transport)
        run: |
          set -euo pipefail
          python -m scripts.run_ws6_stripe_sync --fake
          # Idempotent: a second run submits nothing new and still exits 0.
          python -m scripts.run_ws6_stripe_sync --fake
      - name: Metering reconciliation + webhook idempotency suites (T5 CI exit)
        # Explicit CI job for the money-critical suites (blueprint T5); the
        # nightly cron proves them against the real store each day, not just
        # on push.
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_ws6_t1_metering.py \
            tests/test_ws6_t2_stripe.py \
            -q --tb=short
