# WS-4 T4: nginx reverse-proxy — the omission-reconciliation anchor.
#
# §3.5 requires the reconciliation sweep to replay a request log written
# *outside the app's code path*, so a bug that suppresses an audit row cannot
# also erase the evidence against it. This config:
#
#   1. Propagates/generates `X-Request-ID` per request ($request_id), which the
#      API echoes on every response and stamps on every audit row.
#   2. Logs it in the access log via the `pakhi` log_format below.
#   3. Ships a documented parse format (see scripts/run_audit_sweep.py and
#      pakhi/ws4/audit_events.py::parse_nginx_access_line), which is exactly
#      what the sweep consumes.
#
# Place this inside a server{} block (or include it); the access log path is
# the sweep's input.

log_format pakhi '$remote_addr $request_id "$request_method $request_uri $server_protocol" $status';

# access_log <path> pakhi;
# example:
# access_log /var/log/nginx/pakhi-access.log pakhi;

# The API app (single uvicorn worker per the locked single-worker contract).
# upstream pakhi_app {
#     server 127.0.0.1:8000;
# }

# server {
#     listen 443 ssl;
#     access_log /var/log/nginx/pakhi-access.log pakhi;
#
#     location / {
#         # nginx generates $request_id if the client did not send one and
#         # forwards it; the API echoes it back and stamps audit rows with it.
#         proxy_set_header X-Request-ID $request_id;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_pass http://pakhi_app;
#     }
# }
#
# Parse format (one JSON-free line per request):
#   <remote_addr> <request_id> "<method> <uri> <proto>" <status>
#   e.g.  198.51.100.7 4c743ff5605a "POST /v1/admin/tenants HTTP/1.1" 201
#
# The sweep joins these by request_id against audit_events and fails on any
# mutating request_id (POST /v1/admin/tokens|keys|tenants, POST /v1/backtests)
# that has no audit row.
