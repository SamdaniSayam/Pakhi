services:
  # ── Pakhi CLI ─────────────────────────────────────────────────────────
  pakhi:
    build: .
    image: pakhi:latest
    container_name: pakhi
    entrypoint: ["pakhi"]
    command: ["--help"]
    volumes:
      - pakhi-data:/home/pakhi/data
      - ./examples:/home/pakhi/examples:ro
    environment:
      - PAKHI_HOME=/home/pakhi
    restart: "no"

  # ── Pakhi Dashboard (long-running) ────────────────────────────────────
  dashboard:
    build: .
    image: pakhi:latest
    container_name: pakhi-dashboard
    entrypoint: ["pakhi"]
    command: ["status"]
    volumes:
      - pakhi-data:/home/pakhi/data
    environment:
      - PAKHI_HOME=/home/pakhi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pakhi", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── WS-2 Database (TimescaleDB) ───────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: pakhi_timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pakhi
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data

  # ── WS-3 Public API (REST + WebSocket) ─────────────────────────────────
  api:
    build: .
    image: pakhi:latest
    container_name: pakhi-api
    entrypoint: ["uvicorn", "pakhi.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - PAKHI_HOME=/home/pakhi
      - PAKHI_DB_READ_URL=postgresql://postgres:postgres@db:5432/pakhi
      - PAKHI_DB_WRITE_URL=postgresql://postgres:postgres@db:5432/pakhi
      - PAKHI_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pakhi-data:
    driver: local
  timescaledb-data:
    driver: local
