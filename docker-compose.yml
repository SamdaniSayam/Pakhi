services:
  # ── Pakhi CLI ─────────────────────────────────────────────────────────
  pakhi:
    build: .
    image: pakhi:latest
    container_name: pakhi
    entrypoint: ["pakhi"]
    command: ["--help"]
    volumes:
      - pakhi-data:/home/pakhi/data
      - ./examples:/home/pakhi/examples:ro
    environment:
      - PAKHI_HOME=/home/pakhi
    restart: "no"

  # ── Pakhi Dashboard (long-running) ────────────────────────────────────
  dashboard:
    build: .
    image: pakhi:latest
    container_name: pakhi-dashboard
    entrypoint: ["pakhi"]
    command: ["status"]
    volumes:
      - pakhi-data:/home/pakhi/data
    environment:
      - PAKHI_HOME=/home/pakhi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pakhi", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── WS-2 Database (TimescaleDB) ───────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: pakhi_timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pakhi
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data

volumes:
  pakhi-data:
    driver: local
  timescaledb-data:
    driver: local
