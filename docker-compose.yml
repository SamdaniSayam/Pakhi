services:
  # ── Pakhi CLI ─────────────────────────────────────────────────────────
  pakhi:
    build: .
    image: pakhi:latest
    container_name: pakhi
    entrypoint: ["pakhi"]
    command: ["--help"]
    volumes:
      - pakhi-data:/home/pakhi/data
      - ./examples:/home/pakhi/examples:ro
    environment:
      - PAKHI_HOME=/home/pakhi
    restart: "no"

  # ── Pakhi Dashboard (long-running) ────────────────────────────────────
  dashboard:
    build: .
    image: pakhi:latest
    container_name: pakhi-dashboard
    entrypoint: ["pakhi"]
    command: ["status"]
    volumes:
      - pakhi-data:/home/pakhi/data
    environment:
      - PAKHI_HOME=/home/pakhi
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pakhi", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── WS-2 Database (TimescaleDB) ───────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: pakhi_timescaledb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pakhi
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data

  # ── WS-5 Shared Rate-Limit / Budget State (Redis) ─────────────────────
  redis:
    image: redis:7
    container_name: pakhi_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── WS-3 Public API (REST + WebSocket) ─────────────────────────────────
  api:
    build: .
    image: pakhi:latest
    container_name: pakhi-api
    entrypoint: ["uvicorn", "pakhi.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - PAKHI_HOME=/home/pakhi
      - PAKHI_DB_READ_URL=postgresql://postgres:postgres@db:5432/pakhi
      - PAKHI_DB_WRITE_URL=postgresql://postgres:postgres@db:5432/pakhi
      - PAKHI_REDIS_URL=redis://redis:6379/0
      - PAKHI_LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── WS-5 Observability (Prometheus + Grafana) ──────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: pakhi_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: pakhi_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pakhi-data:
    driver: local
  timescaledb-data:
    driver: local
  redis-data:
    driver: local
